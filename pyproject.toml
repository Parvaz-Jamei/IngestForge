[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ingestforge"
version = "0.4.0a6"
description = "Auditable AI content ingestion: safe fetch, extraction, evidence gates, provenance ledgers, RAG datasets, and configurable provider/API exports."
readme = { file = "README.md", content-type = "text/markdown" }
requires-python = ">=3.11,<3.15"
license = "MIT"
authors = [{ name = "Parvaz Jamei" }]
keywords = ["ai", "rag", "ingestion", "content-ingestion", "dataset", "web-extraction", "structured-output", "ocr", "multimodal", "provenance", "openai", "gemini", "deepseek", "api-automation"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
  "Topic :: Text Processing :: Indexing",
  "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
  "beautifulsoup4>=4.12",
  "httpx>=0.27",
  "pydantic>=2.7",
  "pydantic-settings>=2.0",
  "PyYAML>=6.0",
  "typer>=0.12",
  "charset-normalizer>=3.3",
]

[project.urls]
Homepage = "https://github.com/Parvaz-Jamei/ingestforge"
Repository = "https://github.com/Parvaz-Jamei/ingestforge"
Issues = "https://github.com/Parvaz-Jamei/ingestforge/issues"
Documentation = "https://github.com/Parvaz-Jamei/ingestforge/tree/main/docs"

[project.scripts]
ingestforge = "ingestforge.cli:app"

[project.optional-dependencies]
openai = ["openai>=1.0"]
gemini = ["google-genai>=1.0"]
deepseek = ["openai>=1.0"]
ocr = ["pytesseract>=0.3", "pillow>=10.0"]
vision = ["pillow>=10.0"]
providers = ["openai>=1.0", "google-genai>=1.0"]
tokenizers = ["tiktoken>=0.8"]
text = ["charset-normalizer>=3.3"]
extraction = ["trafilatura>=2.0"]
playwright = ["playwright>=1.45"]
dev = ["pytest>=8.0", "pytest-cov>=5.0", "ruff>=0.7", "mypy>=1.10", "types-PyYAML>=6.0", "build>=1.2", "twine>=5.1", "pip-audit>=2.7", "pillow>=10.0", "pytesseract>=0.3"]
all = ["openai>=1.0", "google-genai>=1.0", "pytesseract>=0.3", "pillow>=10.0", "playwright>=1.45", "tiktoken>=0.8", "charset-normalizer>=3.3", "trafilatura>=2.0"]

[tool.setuptools.packages.find]
where = ["src"]
include = ["ingestforge*"]

[tool.setuptools.package-data]
ingestforge = ["py.typed", "provider_contracts.yaml", "prompts/*.j2", "profiles/*.yaml", "profiles/examples/*.yaml"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.11"
strict = false
warn_unused_ignores = true
warn_redundant_casts = true
disable_error_code = ["import-untyped"]
